<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Google Forms DOM regression fixture</title><style>body{font:16px system-ui;margin:20px;background:#f1eef9}.Qr7Oae{padding:22px;margin:16px 0;background:white;border:1px solid #ddd;border-radius:9px}[role=radio],[role=checkbox],[role=listbox]{padding:10px;border:1px solid #bbb;margin:8px;cursor:pointer;min-width:70px}[aria-checked=true]{background:#ded1f9}[role=option]{padding:12px}[role=listbox][aria-expanded=false] [role=option]{display:none}[role=listbox][aria-expanded=false] [aria-selected=true]{display:block}input{padding:10px}.required{color:red}</style></head><body>
<!-- Representative accessible markup, not a network-dependent copy of a live Google form. -->
<div role="listitem"><div class="Qr7Oae"><div role="heading" id="i1"><span class="M7eMe">What is 2 + 2?</span><span class="required"> *</span></div><div role="radiogroup" aria-labelledby="i1" aria-required="true"><label><div role="radio" tabindex="0" aria-checked="false" aria-label="3" data-value="3" data-answer-value="3"><span aria-hidden="true">○</span></div><span>3</span></label><label><div role="radio" tabindex="0" aria-checked="false" aria-label="4" data-value="4" data-answer-value="4"><span aria-hidden="true">○</span></div><span>4</span></label><label><div role="radio" tabindex="0" aria-checked="false" aria-label="5" data-value="5" data-answer-value="5"><span aria-hidden="true">○</span></div><span>5</span></label></div><input type="hidden" name="entry.1" value=""></div></div>
<div role="listitem"><div class="Qr7Oae"><div role="heading" id="i2"><span class="M7eMe">Select the prime numbers</span></div><div role="group" aria-labelledby="i2"><label><div role="checkbox" tabindex="0" data-answer-value="2" aria-label="2" aria-checked="false"></div><span>2</span></label><label><div role="checkbox" tabindex="0" data-answer-value="3" aria-label="3" aria-checked="false"></div><span>3</span></label><label><div role="checkbox" tabindex="0" data-answer-value="4" aria-label="4" aria-checked="false"></div><span>4</span></label></div></div></div>
<div role="listitem"><div class="Qr7Oae"><div role="heading" id="i3"><span class="M7eMe">First name</span><span> *</span></div><input aria-label="Your answer" type="text" name="entry.3"></div></div>
<div role="listitem"><div class="Qr7Oae"><div role="heading" id="i4"><span class="M7eMe">Which planet is called the red planet?</span></div><div role="listbox" tabindex="0" aria-labelledby="i4" aria-expanded="false"><div role="option" data-value="" aria-selected="true">Choose</div><div role="option" data-value="Venus" aria-selected="false">Venus</div><div role="option" data-value="Mars" aria-selected="false">Mars</div></div></div></div>
<div role="listitem"><div class="Qr7Oae"><div role="heading" id="i5"><span class="M7eMe">Mark each statement</span></div><span id="row1">The sky is blue</span><div role="radiogroup" aria-labelledby="i5 row1"><div role="radio" tabindex="0" aria-label="True" data-value="True" aria-checked="false"></div><div role="radio" tabindex="0" aria-label="False" data-value="False" aria-checked="false"></div></div><span id="row2">Two plus two is five</span><div role="radiogroup" aria-labelledby="i5 row2"><div role="radio" tabindex="0" aria-label="True" data-value="True" aria-checked="false"></div><div role="radio" tabindex="0" aria-label="False" data-value="False" aria-checked="false"></div></div></div></div>
<script>
for(const node of document.querySelectorAll('[role=radio]'))node.addEventListener('click',()=>setTimeout(()=>{for(const sibling of node.closest('[role=radiogroup]').querySelectorAll('[role=radio]'))sibling.setAttribute('aria-checked',String(sibling===node));},180));
for(const node of document.querySelectorAll('[role=checkbox]'))node.addEventListener('click',()=>setTimeout(()=>node.setAttribute('aria-checked',String(node.getAttribute('aria-checked')!=='true')),200));
for(const list of document.querySelectorAll('[role=listbox]'))list.addEventListener('click',event=>{const option=event.target.closest('[role=option]');if(option&&list.getAttribute('aria-expanded')==='true'){for(const other of list.querySelectorAll('[role=option]'))other.setAttribute('aria-selected',String(other===option));list.setAttribute('aria-expanded','false');}else list.setAttribute('aria-expanded','true');});
</script></body></html>
